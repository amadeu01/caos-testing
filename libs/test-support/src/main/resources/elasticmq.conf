include classpath("application.conf")

# "*" makes queue URLs use the host the client called, so they work both
# inside Compose and from tests on the host.
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
}

queues {
  ratings {}
}
